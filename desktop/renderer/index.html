<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; media-src media:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>Video Extractor</title><link rel="stylesheet" href="style.css"></head><body>
<main class="app">
<header><div><h1>Video Extractor</h1><p>把喜欢的片段，带回来。</p></div><button id="quick" class="mascot" title="聚焦链接输入"><img src="mascot.png" alt="小粽子"></button></header>
<form id="download-form"><div class="link-field"><span class="link-icon">↗</span><input id="url" aria-label="视频链接" placeholder="粘贴视频链接或分享文字" autocomplete="off"><button type="button" id="paste" class="plain muted">粘贴</button></div><button id="extract" class="primary" type="submit">提取 ↗</button></form>
<div class="options"><div class="segmented"><button id="video-mode" aria-pressed="true" class="active">视频</button><button id="audio-mode" aria-pressed="false">音频</button></div><select id="quality" aria-label="视频画质"><option value="480">480p</option><option value="720">720p</option><option value="1080" selected>1080p</option><option value="2160">4K</option></select><span id="audio-note" hidden>MP3</span><div class="grow"></div><button class="plain" id="local-video">✂ 截取本地视频</button></div>
<div class="destination"><span class="muted">保存到</span><button id="destination" class="path plain" title="打开保存文件夹"></button><button id="choose-folder" class="plain muted">▱ 更改文件夹</button></div>
<div id="message" class="message" role="alert" hidden></div>
<section class="tasks"><div class="section-bar"><h2 id="task-count">视频任务 <span>/ 0</span></h2><div class="filters"><button data-filter="all" class="active">全部</button><button data-filter="active">进行中</button><button data-filter="finished">已完成</button></div></div><div id="jobs"></div></section>
<footer><span id="engine-status" class="muted">检查内置引擎…</span><div class="grow"></div><span class="muted version">独立测试版 · v0.2.1</span><button id="open-folder" class="glyph" title="打开保存文件夹">▱</button></footer>
</main>
<dialog id="clip-dialog"><div class="clip-heading"><div class="clip-icon">✂</div><div class="grow"><h2>截取片段</h2><p id="clip-name" class="muted"></p></div><button id="close-clip" class="glyph" aria-label="关闭截取窗口">×</button></div>
<div class="player"><video id="player" preload="metadata"></video><div id="player-hint" class="muted" hidden>此视频格式无法直接预览，请选择 MP4（H.264）或 WebM。</div></div>
<div id="timeline" class="timeline" aria-label="片段时间线"><div class="rail"></div><div id="selection" class="selection"></div><div id="playhead" class="playhead"></div><button class="handle start" id="start-handle" role="slider" aria-label="片段开始节点" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0"><span>开始</span><i>Ⅱ</i></button><button class="handle end" id="end-handle" role="slider" aria-label="片段结束节点" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0"><i>Ⅱ</i><span>结束</span></button></div>
<div class="play-controls"><button id="play-toggle" class="plain">▶ 播放</button><label class="speed-label"><span class="muted">倍速</span><select id="speed-presets" aria-label="播放倍速"><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option><option value="custom">自定义</option></select><input id="custom-speed" type="number" min="0.25" max="2" step="0.01" value="1" aria-label="自定义倍速" hidden></label><div class="grow"></div><span id="player-time" class="muted mono">00:00:00.000 / 00:00:00.000</span></div>
<div class="time-fields"><label><span class="muted">开始时间</span><button id="mark-start" class="plain accent" type="button">使用当前画面</button><input id="start-time" value="00:00:00.000" aria-label="开始时间"></label><span class="muted">→</span><label><span class="muted">结束时间</span><button id="mark-end" class="plain accent" type="button">使用当前画面</button><input id="end-time" value="00:00:00.000" aria-label="结束时间"></label></div>
<div id="clip-summary" class="accent"></div><div id="clip-error" class="message" role="alert" hidden></div>
<div id="export-progress" class="export-progress" hidden><progress id="export-bar" max="1" value="0"></progress><span id="export-percent">导出中 0%</span><button id="cancel-export">取消导出</button></div>
<div id="export-result" hidden><span class="accent">✓ 片段已保存</span><div class="grow"></div><button id="open-export">打开片段</button><button id="reveal-export">在文件夹中显示</button></div>
<div class="clip-bottom"><span class="muted">按所选倍速导出新 MP4，保留原视频。</span><div class="grow"></div><button id="preview-clip">预览片段</button><button id="export-clip" class="primary">导出片段 ↗</button></div>
</dialog>
<script src="renderer.js"></script></body></html>
